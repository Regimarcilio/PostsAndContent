<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
<rect width="1440" height="920" fill="#073B46"/><text x="72" y="78" fill="#76E0D7" font-family="Arial,sans-serif" font-size="24" font-weight="700">READ PATH · MONTHLY ARRAY</text>
<text x="72" y="140" fill="#F8FBF7" font-family="Arial,sans-serif" font-size="42" font-weight="700">Full months use aggregates; partial periods read selected days</text>
<text x="72" y="180" fill="#BED4D2" font-family="Arial,sans-serif" font-size="23">Meses completos usam agregados; períodos parciais leem apenas os dias necessários</text>
<rect x="72" y="230" width="1296" height="260" rx="22" fill="#0B4B54" stroke="#2D6A70" stroke-width="3"/>
<text x="112" y="278" fill="#76E0D7" font-family="Arial,sans-serif" font-size="25" font-weight="700">FULL MONTH / MÊS COMPLETO</text>
<text x="112" y="322" fill="#F8FBF7" font-family="Arial,sans-serif" font-size="21">One monthly row → read the stored aggregate</text><text x="112" y="355" fill="#BED4D2" font-family="Arial,sans-serif" font-size="19">Uma linha mensal → consulta o agregado armazenado</text>
<rect x="112" y="386" width="520" height="62" rx="12" fill="#073B46" stroke="#76E0D7" stroke-width="2"/><text x="138" y="426" fill="#F8FBF7" font-family="monospace" font-size="18">SUM / MAX / last non-NULL value</text>
<text x="680" y="423" fill="#F2C84B" font-family="Arial,sans-serif" font-size="42" font-weight="700">→</text><rect x="770" y="382" width="520" height="72" rx="16" fill="#1C5F62"/><text x="812" y="428" fill="#F8FBF7" font-family="Arial,sans-serif" font-size="23" font-weight="700">No daily array scan</text>
<rect x="72" y="530" width="1296" height="320" rx="22" fill="#0B4B54" stroke="#2D6A70" stroke-width="3"/>
<text x="112" y="580" fill="#FF9347" font-family="Arial,sans-serif" font-size="25" font-weight="700">PARTIAL WINDOW / PERÍODO PARCIAL</text>
<text x="112" y="620" fill="#F8FBF7" font-family="Arial,sans-serif" font-size="20">Read the boundary row(s), then scan only the requested array positions.</text>
<text x="112" y="653" fill="#BED4D2" font-family="Arial,sans-serif" font-size="19">Leia a(s) linha(s) de borda e percorra apenas as posições selecionadas.</text>
