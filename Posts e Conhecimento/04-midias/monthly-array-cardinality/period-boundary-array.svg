oke-width="2"/><text x="1154" y="767" text-anchor="middle" fill="#BED4D2" font-family="Arial,sans-serif" font-size="12">28</text><rect x="1174" y="680" width="29" height="56" rx="6" fill="#51496F" stroke="#2D6A70" stroke-width="2"/><text x="1188" y="767" text-anchor="middle" fill="#BED4D2" font-family="Arial,sans-serif" font-size="12">29</text><rect x="1208" y="680" width="29" height="56" rx="6" fill="#51496F" stroke="#2D6A70" stroke-width="2"/><text x="1222" y="767" text-anchor="middle" fill="#BED4D2" font-family="Arial,sans-serif" font-size="12">30</text><rect x="1242" y="680" width="29" height="56" rx="6" fill="#51496F" stroke="#2D6A70" stroke-width="2"/><text x="1256" y="767" text-anchor="middle" fill="#BED4D2" font-family="Arial,sans-serif" font-size="12">31</text><text x="112" y="815" fill="#F8FBF7" font-family="Arial,sans-serif" font-size="18">Amber positions = selected days / Posições laranja = dias selecionados</text>
<text x="772" y="815" fill="#BED4D2" font-family="Arial,sans-serif" font-size="18">Across two months, read the two boundary rows.</text>
<text x="72" y="892" fill="#BED4D2" font-family="Arial,sans-serif" font-size="18">NULL means no reading; 0 remains a valid reading. / NULL significa ausência de leitura; 0 continua sendo válido.</text>
